name: profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Змейка по графику контрибуций
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%232da44e&color_dots=%23ebedf0,%23aceebb,%234ac26b,%232da44e,%23116329
            dist/snake-dark.svg?palette=github-dark&color_snake=%2339d353

      # snk — Docker-экшен, он работает от root и создаёт dist/ с владельцем root.
      # Дальше шаги идут от runner, которому туда писать уже нельзя.
      - name: Вернуть права на dist
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Блок активности
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node tools/stats.js dist

      - name: Выложить в ветку output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
